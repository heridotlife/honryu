# Non-secret configuration shared by api, scheduler, and calibrator: all
# three load config.Load(getenv) (cmd/api, cmd/scheduler, cmd/calibrator
# all wire to internal/config), and this shape is common across them.
# Component-specific env (auth mode, calibration tick interval) lives on
# each Deployment directly, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "honryu.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
data:
  HONRYU_DB_DRIVER: {{ .Values.config.dbDriver | quote }}
  HONRYU_SCHEDULER: {{ .Values.config.scheduler | quote }}
  HONRYU_K8S_NAMESPACE: {{ .Release.Namespace | quote }}
  HONRYU_DEFAULT_ENGINE: {{ .Values.config.defaultEngine | quote }}
  HONRYU_ENABLE_RBAC: {{ .Values.config.enableRbac | quote }}
  HONRYU_ENGINE_IMAGES: {{ .Values.config.engineImages | quote }}
  HONRYU_DEPLOY_CONTEXT: {{ .Values.config.deployContext | quote }}
  {{- if .Values.config.engineIdleTTL }}
  HONRYU_ENGINE_IDLE_TTL: {{ .Values.config.engineIdleTTL | quote }}
  {{- end }}
  {{- if .Values.config.triggerAbsentTimeout }}
  HONRYU_TRIGGER_ABSENT_TIMEOUT: {{ .Values.config.triggerAbsentTimeout | quote }}
  {{- end }}
  HONRYU_SIDECAR_IMAGE: {{ printf "%s/honryu-sidecar:%s" .Values.image.registry .Values.image.sidecar.tag | quote }}
  HONRYU_INGEST_URL: {{ include "honryu.ingestUrl" . | quote }}
  HONRYU_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  HONRYU_STORAGE_ROOT: {{ .Values.config.storageRoot | quote }}
