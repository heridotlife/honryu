{{- if .Values.prometheus.enabled -}}
# Pod discovery (prometheus-configmap.yaml) reads the Kubernetes API: list
# and watch pods in the release namespace, and only that. A dedicated
# ServiceAccount rather than the app-wide one (serviceAccount.yaml): the
# honryu SA carries the scheduler Role's pod-delete and secret-write powers
# (rbac.yaml), and a metrics scraper has no business holding them. Namespace-
# scoped on purpose -- no cluster-scope, no write verbs, nothing beyond pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "honryu.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "honryu.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "honryu.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
subjects:
  - kind: ServiceAccount
    name: {{ include "honryu.fullname" . }}-prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "honryu.fullname" . }}-prometheus
{{- end -}}
