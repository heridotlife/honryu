{{- if .Values.prometheus.enabled -}}
# A minimal Prometheus, not kube-prometheus-stack: one scrape target, so an
# operator, CRDs, Alertmanager and node-exporter would be infrastructure to
# operate for no corresponding value (spec Approach strand D, rejected
# alternative). No HA -- single replica, matching every other platform
# component in this chart (spec Non-goals).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honryu.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. Found live (2026-08-19): a
  # rolling update deadlocks this pod against itself, because Prometheus
  # takes an exclusive lock on its TSDB directory. The incoming pod dies
  # with "opening storage failed: lock DB directory: resource temporarily
  # unavailable" while the outgoing pod still holds it, and the outgoing pod
  # is never retired because the incoming one never goes Ready --
  # CrashLoopBackOff until someone deletes the old pod by hand.
  #
  # Latent since the component was added; it took the first change to this
  # template since install to surface it. Recreate costs a few seconds of
  # scrape gap on upgrade, which is the correct trade for a single-replica
  # component on a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "honryu.selectorLabels" (merge (dict "component" "prometheus") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "honryu.selectorLabels" (merge (dict "component" "prometheus") .) | nindent 8 }}
    spec:
      # Own SA + Role from prometheus-rbac.yaml: pod discovery lists/watches
      # pods in this namespace and nothing else. Defaulting to the "default"
      # SA would make every scrape target discovery fail on RBAC (403).
      serviceAccountName: {{ include "honryu.fullname" . }}-prometheus
      # Shares the control-plane node with the PVC it mounts, for the same
      # Karpenter-eviction reasoning as mysql and the object store.
      nodeSelector:
        {{- toYaml .Values.statefulNodeSelector | nindent 8 }}
      securityContext:
        {{- toYaml .Values.prometheus.podSecurityContext | nindent 8 }}
      containers:
        - name: prometheus
          image: "prom/prometheus:{{ .Values.image.prometheus.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.prometheus.containerSecurityContext | nindent 12 }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ include "honryu.fullname" . }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "honryu.fullname" . }}-prometheus
{{- end -}}
