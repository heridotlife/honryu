apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honryu.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "honryu.selectorLabels" (merge (dict "component" "api") .) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the shared ConfigMap's contents change.
        #
        # Without this, `helm upgrade` updates the ConfigMap and stops there:
        # envFrom injects values at pod start, so a running pod keeps the env
        # it booted with and the change silently does not take effect. Found
        # exactly that way on 2026-08-19 -- the ConfigMap read
        # engine-jmeter:5.6.3-3 while the api process still had 5.6.3-2, so a
        # new run would have deployed the old engine image while every pod
        # reported healthy.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "honryu.selectorLabels" (merge (dict "component" "api") .) | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Pinned to the control-plane node: it mounts the object-store PVC,
      # which a local-path volume binds to whichever node created it. A
      # Karpenter reschedule onto a different node would strand the volume.
      nodeSelector:
        {{- toYaml .Values.statefulNodeSelector | nindent 8 }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/honryu-api:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/honryu-api"]
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "honryu.fullname" . }}-config
          env:
            - name: HONRYU_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mysqlCredentials }}
                  key: dsn
            - name: HONRYU_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.ingestToken }}
                  key: token
            - name: HONRYU_CLUSTER_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clusterCredentialKey }}
                  key: credential-key
            - name: HONRYU_AUTH_MODE
              value: {{ .Values.api.authMode | quote }}
            {{- if .Values.demo.enabled }}
            # Demo persona sessions. Gated so a default install never
            # requires the session-key Secret to exist: secretKeyRef with a
            # missing Secret blocks pod startup, and every deployment that
            # has not opted into demo mode must stay installable as-is.
            - name: HONRYU_DEMO_ENABLED
              value: "true"
            - name: HONRYU_DEMO_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.demoSessionKey }}
                  key: signing-key
            - name: HONRYU_DEMO_PROFILES
              value: {{ .Values.demo.profiles | toJson | quote }}
            {{- end }}
            {{- if .Values.apm.linkTemplates }}
            # Customer-APM link-out templates (phase 37). Gated on the list
            # being non-empty so a default install renders exactly the env
            # it always did -- the demo.profiles precedent.
            - name: HONRYU_APM_LINK_TEMPLATES
              value: {{ .Values.apm.linkTemplates | toJson | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /honryu-storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "honryu.fullname" . }}-object-store
        # Writable /tmp, required because the root filesystem is read-only.
        # Not speculative: parseUpload calls r.ParseMultipartForm
        # (internal/adapters/httpapi/files_handlers.go:19), and Go's
        # multipart reader spills parts to os.TempDir() once they exceed the
        # in-memory budget. MaxBytesReader caps the body at the same
        # maxUploadBytes, which *should* keep every part in memory -- but
        # "should" is not what a JMX upload failing at 3am wants to rest on,
        # and an emptyDir costs nothing.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
