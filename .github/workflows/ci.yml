name: CI

on:
  # pull_request covers feature->develop and develop->main; since phase 14
  # every phase merge goes through a feat->develop PR, so pull_request
  # already gives feat branches full CI -- a feat/** push trigger is pure
  # duplication (and raced pull_request into double runs; a concurrency
  # group cannot fix a 3-second registration race). push stays for main
  # only, covering the post-merge case.
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch: guards the edge where a main push and a
# develop->main PR-sync event race (head_ref is the PR's source branch;
# ref_name is the pushed bare branch name -- plain ref would never match).
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run ./..."
      - name: Unit tests (race)
        run: go test -race -count=1 ./...

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3
      - name: Lint and render the chart
        run: ./scripts/helm-lint.sh

  coverage:
    name: Coverage gate (unit + integration + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Run coverage gate
        run: ./scripts/coverage.sh
        env:
          COVERAGE_THRESHOLD: "90"
          # GitHub-hosted runners provide Docker for testcontainers.
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cover.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out

  # Phase 64 introduced the boot e2e harness on every PR; phase 66 promoted
  # it to a REQUIRED lane. It runs unconditionally (no `if:`), has no
  # continue-on-error anywhere, and a failed step fails the job -- which
  # fails the run red exactly like the coverage gate above. Branch
  # protection keys on the check name, so the job name is the contract:
  # "e2e boot harness" is what the required-check set references. Results
  # stay visible on every PR; the difference since phase 64 is that a red
  # harness now blocks the merge instead of merely informing it.
  #
  # Fast by construction: the API embeds the SPA (web/embed.go) and runs on
  # the default in-memory repo (HONRYU_DB_DRIVER=fake), so the whole stack
  # under test is one Go binary and NO service containers -- unlike the
  # coverage lane, which needs Docker for the adapter contract tests. bun's
  # setup action caches installs, and the Chromium download is cached below,
  # so steady-state the lane adds well under five minutes.
  #
  # The harness's purge scenario (D) finds nothing purgeable here and
  # records its designed SKIP -- its exit rule counts SKIP as pass, so the
  # lane treats designed-skip as green by construction.
  e2e:
    name: e2e boot harness
    runs-on: ubuntu-latest
    env:
      # Must track web/package.json's resolved playwright-core version: the
      # downloaded Chromium build is keyed on it (both here and in the cache).
      PLAYWRIGHT_VERSION: "1.62.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build the SPA
        working-directory: web
        run: bun run build
      - name: Build the API (embeds the SPA just built)
        run: go build -o honryu-api ./cmd/api
      - name: Provision Chromium
        working-directory: web
        run: bunx playwright@$PLAYWRIGHT_VERSION install --with-deps chromium
      - name: Start the API (demo auth, in-memory repo)
        run: |
          ./honryu-api &> api.log &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          # Fails the lane if the API never became ready.
          curl -fsS http://127.0.0.1:8080/healthz
        env:
          HONRYU_AUTH_MODE: demo
          HONRYU_DEMO_ENABLED: "true"
          # Demo mode refuses to start without enforced RBAC (a picker over
          # unenforced RBAC is a costume, not enforcement -- config.Validate).
          HONRYU_ENABLE_RBAC: "true"
          HONRYU_DEMO_SIGNING_KEY: ci-e2e-signing-key
          # One service-provider-admin persona named "alice" -- the harness
          # looks for that card by text. No tenants: the boot checks need the
          # picker, a login, and an empty list, nothing seeded.
          HONRYU_DEMO_PROFILES: '[{"id":"alice","name":"Alice","global":["service_provider_admin"]}]'
      - name: Run the boot e2e harness
        working-directory: web
        run: bun run e2e
        env:
          HONRYU_E2E_BASE_URL: http://127.0.0.1:8080
      - name: API log (diagnostics)
        if: failure()
        run: cat api.log
